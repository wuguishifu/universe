services:
  osmium:
    image: ghcr.io/wuguishifu/universe/osmium:latest
    container_name: osmium
    ports:
      - 3001:3001
    networks:
      - universe-network
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      HYDROGEN_DATABASE: hydrogen
      HYDROGEN_HOST: postgres
      HYDROGEN_PORT: 5432
      HYDROGEN_USER: ${POSTGRES_USER}
      HYDROGEN_PASSWORD: ${POSTGRES_PASSWORD}
      OSMIUM_API_ACCESS_KEY: ${OSMIUM_API_ACCESS_KEY}
  postgres:
    image: postgres:16-alpine
    container_name: hydrogen-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    configs:
      - source: postgres-init
        target: /docker-entrypoint-initdb.d/01-create-dbs.sql
    ports:
      - 5432:5432
    networks:
      - universe-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  pgadmin:
    image: dpage/pgadmin4
    container_name: hydrogen-pgadmin
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_SERVER_JSON_FILE: /var/lib/pgadmin/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    configs:
      - source: pgadmin-servers
        target: /var/lib/pgadmin/servers.json
    ports:
      - 5050:80
    networks:
      - universe-network
  redis:
    image: redis:7-alpine
    container_name: hydrogen-redis
    volumes:
      - redis-data:/data
    networks:
      - universe-network
  redash-server:
    image: redash/redash:latest
    container_name: hydrogen-redash
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      # Note: 'postgres' here refers to the service name, not container_name
      REDASH_DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/redash"
      REDASH_REDIS_URL: "redis://redis:6379/0"
      REDASH_SECRET_KEY: ${REDASH_SECRET_KEY}
      REDASH_COOKIE_SECRET: ${REDASH_COOKIE_SECRET}
    ports:
      - 5051:5000
    command: server
    networks:
      - universe-network
  redash-worker:
    image: redash/redash:latest
    container_name: hydrogen-redash-worker
    depends_on:
      - redash-server
    environment:
      REDASH_DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/redash"
      REDASH_REDIS_URL: "redis://redis:6379/0"
      REDASH_SECRET_KEY: ${REDASH_SECRET_KEY}
      REDASH_COOKIE_SECRET: ${REDASH_COOKIE_SECRET}
    command: worker
    networks:
      - universe-network

configs:
  postgres-init:
    file: ./postgres/init/01-create-dbs.sql
  pgadmin-servers:
    file: ./pgadmin/servers.json

networks:
  universe-network:
    driver: bridge

volumes:
  postgres-data:
  pgadmin-data:
  redis-data:
