# Speaker diarization CLI that transcription-worker runs (DIARIZER_PATH), like whisper-cli. Installed
# per host with `uv sync --frozen --no-dev --no-editable`, which puts a `diarize` command in the venv.
[project]
name = "diarizer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2",
  "pyannote.audio>=4.0.7,<5",
  "torch>=2.8",
]

[project.scripts]
diarize = "diarizer:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv]
# The hosts this runs on: the Mac mini (Metal) and, eventually, a Linux CUDA box.
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# PyPI's macOS torch has Metal (MPS); Linux needs PyTorch's own CUDA builds.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
