packages:
  - 'libs/*'
  - 'platform/*/*'
  - 'projects/*/*'
allowBuilds:
  '@google/genai': true
  '@nestjs/core': true
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@swc/core': true
  esbuild: true
  less: true
  msgpackr-extract: true
  necord: true
  nx: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
autoInstallPeers: true
ignoreWorkspaceRootCheck: true
nodeLinker: hoisted
strictPeerDependencies: false
