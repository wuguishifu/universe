name: Deploy Server App

run-name: ${{ inputs.app }}

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to deploy'
        required: true
        type: choice
        options:
          - topaz
          - silver
      version-bump-type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ inputs.app }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  APP_PATH: apps/${{ inputs.app }}

jobs:
  deploy:
    name: Deploy ${{ inputs.app }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}

      - name: Load config
        id: config
        run: |
          CONFIG=$(cat .github/config/server-app-config.json)
          CONFIG_PATH=".apps.\"${{ inputs.app }}\""
          REGISTRY_PATH=$(echo "$CONFIG" | jq -r "$CONFIG_PATH.registryPath")
          if [ "$REGISTRY_PATH" == "null" ]; then
            echo "Error: Invalid configuration for app '${{ inputs.app }}'."
            exit 1
          fi

          echo "registry_path=$REGISTRY_PATH" >> $GITHUB_OUTPUT

      - name: Bump version
        id: version
        run: |
          ./.github/scripts/versioning/version-bump.sh ${{ inputs.app }} ${{ inputs.version-bump-type }}

      - name: Get docker version
        id: docker_version
        run: |
          ./.github/scripts/versioning/docker-version.sh ${{ env.REGISTRY }} ${{ steps.config.outputs.registry_path }} ${{ steps.version.outputs.version }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create docker image and push
        run: |
          docker build \
            -f ./${{ env.APP_PATH }}/Dockerfile \
            -t ${{ steps.docker_version.outputs.docker_image }} \
            -t ${{ steps.docker_version.outputs.docker_image_latest }} \
            .
          docker push ${{ steps.docker_version.outputs.docker_image }}
          docker push ${{ steps.docker_version.outputs.docker_image_latest }}
