name: Build Server App

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      app:
        description: 'App to build'
        required: true
        type: choice
        options:
          - iridium
          - osmium
          - palladium
          - platinum
      version-bump-type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: build-server-app-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.app || '' }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  detect:
    name: Detect affected apps
    runs-on: ubuntu-latest
    outputs:
      matrix_amd64: ${{ steps.matrix.outputs.matrix_amd64 }}
      matrix_arm64: ${{ steps.matrix.outputs.matrix_arm64 }}
      matrix_publish: ${{ steps.matrix.outputs.matrix_publish }}
      has_amd64: ${{ steps.matrix.outputs.has_amd64 }}
      has_arm64: ${{ steps.matrix.outputs.has_arm64 }}
      has_apps: ${{ steps.matrix.outputs.has_apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GHCR_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect affected apps
        id: affected
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "apps=${{ inputs.app }}" >> $GITHUB_OUTPUT
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" == "0000000000000000000000000000000000000000" ]; then
              AFFECTED=$(pnpm nx show projects --type=app | tr '\n' ' ')
            else
              AFFECTED=$(pnpm nx show projects --affected --base="$BEFORE" --head="${{ github.sha }}" | tr '\n' ' ')
            fi

            # Filter to only server apps defined in config
            CONFIG_APPS=$(jq -r '.apps | keys[]' .github/config/server-app-config.json)
            MATCHED=""
            for app in $AFFECTED; do
              if echo "$CONFIG_APPS" | grep -q "^${app}$"; then
                MATCHED="$MATCHED $app"
              fi
            done
            echo "apps=$(echo $MATCHED | xargs)" >> $GITHUB_OUTPUT
          fi

      - name: Build matrices
        id: matrix
        run: |
          APPS="${{ steps.affected.outputs.apps }}"
          CONFIG=$(cat .github/config/server-app-config.json)
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          BUMP_TYPE="${{ inputs.version-bump-type || 'patch' }}"

          AMD64_ENTRIES=()
          ARM64_ENTRIES=()
          PUBLISH_ENTRIES=()

          for app in $APPS; do
            REGISTRY_PATH=$(echo "$CONFIG" | jq -r ".apps.\"$app\".registryPath")
            IMAGE_ARCH=$(echo "$CONFIG" | jq -r ".apps.\"$app\".imageArch")

            if [ "$REGISTRY_PATH" == "null" ]; then
              echo "Warning: No config for app '$app', skipping"
              continue
            fi

            # Get version from version-bump.sh (suppress GITHUB_OUTPUT writes)
            VERSION=$(GITHUB_OUTPUT= ./.github/scripts/versioning/version-bump.sh "$app" "$BUMP_TYPE" | grep "Bumping version to:" | sed 's/Bumping version to: //')

            DOCKER_TAG="${VERSION}-${SHORT_SHA}-production"
            IMAGE_BASE="${{ env.REGISTRY }}/${REGISTRY_PATH}"

            # Determine which architectures this app needs
            ARCHES=""
            if echo "$IMAGE_ARCH" | grep -q "amd64"; then
              AMD64_ENTRIES+=("{\"app\":\"$app\",\"image\":\"$IMAGE_BASE\",\"tag\":\"$DOCKER_TAG\",\"version\":\"$VERSION\"}")
              ARCHES="amd64"
            fi
            if echo "$IMAGE_ARCH" | grep -q "arm64"; then
              ARM64_ENTRIES+=("{\"app\":\"$app\",\"image\":\"$IMAGE_BASE\",\"tag\":\"$DOCKER_TAG\",\"version\":\"$VERSION\"}")
              if [ -n "$ARCHES" ]; then
                ARCHES="$ARCHES,arm64"
              else
                ARCHES="arm64"
              fi
            fi

            PUBLISH_ENTRIES+=("{\"app\":\"$app\",\"image\":\"$IMAGE_BASE\",\"tag\":\"$DOCKER_TAG\",\"version\":\"$VERSION\",\"arches\":\"$ARCHES\"}")
          done

          # Build JSON arrays
          AMD64_JSON="[$(IFS=,; echo "${AMD64_ENTRIES[*]}")]"
          ARM64_JSON="[$(IFS=,; echo "${ARM64_ENTRIES[*]}")]"
          PUBLISH_JSON="[$(IFS=,; echo "${PUBLISH_ENTRIES[*]}")]"

          echo "matrix_amd64={\"include\":$AMD64_JSON}" >> $GITHUB_OUTPUT
          echo "matrix_arm64={\"include\":$ARM64_JSON}" >> $GITHUB_OUTPUT
          echo "matrix_publish={\"include\":$PUBLISH_JSON}" >> $GITHUB_OUTPUT

          echo "has_amd64=$( [ ${#AMD64_ENTRIES[@]} -gt 0 ] && echo true || echo false )" >> $GITHUB_OUTPUT
          echo "has_arm64=$( [ ${#ARM64_ENTRIES[@]} -gt 0 ] && echo true || echo false )" >> $GITHUB_OUTPUT
          echo "has_apps=$( [ ${#PUBLISH_ENTRIES[@]} -gt 0 ] && echo true || echo false )" >> $GITHUB_OUTPUT

          echo "AMD64 matrix: $AMD64_JSON"
          echo "ARM64 matrix: $ARM64_JSON"
          echo "Publish matrix: $PUBLISH_JSON"

  build-amd64:
    name: Build ${{ matrix.app }} (amd64)
    needs: detect
    if: needs.detect.outputs.has_amd64 == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix_amd64) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ matrix.image }}:${{ matrix.tag }}-amd64
          provenance: false
          build-args: |
            VERSION=${{ matrix.version }}
            BUILD_ENV=production
            GPG_PASSPHRASE=${{ secrets.GPG_PASSPHRASE }}
          cache-from: type=gha,scope=${{ matrix.app }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-amd64

  build-arm64:
    name: Build ${{ matrix.app }} (arm64)
    needs: detect
    if: needs.detect.outputs.has_arm64 == 'true'
    runs-on: [self-hosted, macOS, ARM64, mac-mini-m4]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix_arm64) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker
          use: true

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ matrix.image }}:${{ matrix.tag }}-arm64
          provenance: false
          build-args: |
            VERSION=${{ matrix.version }}
            BUILD_ENV=production
            GPG_PASSPHRASE=${{ secrets.GPG_PASSPHRASE }}
          cache-from: type=gha,scope=${{ matrix.app }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-arm64

  publish:
    name: Publish ${{ matrix.app }}
    needs: [detect, build-amd64, build-arm64]
    if: >-
      always() &&
      needs.detect.outputs.has_apps == 'true' &&
      needs.detect.result == 'success' &&
      (needs.build-amd64.result == 'success' || needs.build-amd64.result == 'skipped') &&
      (needs.build-arm64.result == 'success' || needs.build-arm64.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix_publish) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHCR_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Create and push manifest
        run: |
          ARCHES="${{ matrix.arches }}"
          SOURCES=""

          IFS=',' read -ra ARCH_ARRAY <<< "$ARCHES"
          for arch in "${ARCH_ARRAY[@]}"; do
            SOURCES="$SOURCES ${{ matrix.image }}:${{ matrix.tag }}-${arch}"
          done

          # Create versioned manifest
          docker manifest create --amend ${{ matrix.image }}:${{ matrix.tag }} $SOURCES
          docker manifest push ${{ matrix.image }}:${{ matrix.tag }}

          # Create latest manifest
          docker manifest create --amend ${{ matrix.image }}:latest $SOURCES
          docker manifest push ${{ matrix.image }}:latest

      - name: Create and push version tag
        run: |
          git tag ${{ matrix.version }}
          git push origin ${{ matrix.version }}
