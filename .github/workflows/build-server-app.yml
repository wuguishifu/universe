name: Deploy Server App

run-name: ${{ inputs.app }}

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to deploy'
        required: true
        type: choice
        options:
          - transcription/service
          - jankbot/core
          - jankbot/gateway
      version-bump-type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  # write: creating the release also creates the <app>-vX.Y.Z tag that the version bump counts from
  contents: write
  packages: write

concurrency:
  group: deploy-${{ inputs.app }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Every image is published as <IMAGE_NAMESPACE>/<imageName>
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  deploy:
    name: Deploy ${{ inputs.app }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}

      - name: Load config
        id: config
        run: |
          CONFIG=$(cat .github/config/server-app-config.json)
          CONFIG_PATH=".apps.\"${{ inputs.app }}\""
          IMAGE_NAME=$(echo "$CONFIG" | jq -r "$CONFIG_PATH.imageName")
          PROJECT_ROOT=$(echo "$CONFIG" | jq -r "$CONFIG_PATH.projectRoot")
          if [ "$IMAGE_NAME" == "null" ] || [ "$PROJECT_ROOT" == "null" ]; then
            echo "Error: Invalid configuration for app '${{ inputs.app }}'."
            exit 1
          fi

          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "project_root=$PROJECT_ROOT" >> $GITHUB_OUTPUT

      # Versions here are always the full <imageName>-vX.Y.Z tag (release name, docker tag, bundle name).
      - name: Bump version
        id: version
        uses: wuguishifu/version-bump-workflow@v1
        with:
          bump-type: ${{ inputs.version-bump-type }}
          tag-prefix: ${{ steps.config.outputs.image_name }}-v
          # First version bump of an app will be applied on top of 0.0.0.
          initial-version: 0.0.0

      - name: Get docker version
        id: docker_version
        uses: wuguishifu/version-bump-workflow/docker-image@v1
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ env.IMAGE_NAMESPACE }}/${{ steps.config.outputs.image_name }}
          version: ${{ steps.version.outputs.tag }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create docker image and push
        run: |
          docker build \
            -f ./${{ steps.config.outputs.project_root }}/Dockerfile \
            -t ${{ steps.docker_version.outputs.image }} \
            -t ${{ steps.docker_version.outputs.image-latest }} \
            .
          docker push ${{ steps.docker_version.outputs.image }}
          docker push ${{ steps.docker_version.outputs.image-latest }}

      - name: Package release bundle
        id: bundle
        env:
          APP: ${{ inputs.app }}
          VERSION: ${{ steps.version.outputs.tag }}
          IMAGE: ${{ steps.docker_version.outputs.image }}
        run: |
          CID=$(docker create "$IMAGE")
          mkdir -p bundle
          docker cp "$CID:/app/." bundle/
          docker rm "$CID" > /dev/null
          rm -rf bundle/node_modules

          NODE_VERSION=$(docker run --rm --entrypoint node "$IMAGE" --version)
          jq -n \
            --arg app "$APP" --arg version "$VERSION" --arg commit "$GITHUB_SHA" \
            --arg image "$IMAGE" --arg node "$NODE_VERSION" \
            '{app: $app, version: $version, commit: $commit, image: $image, node: $node}' \
            > bundle/release.json

          tar -czf "$VERSION.tar.gz" -C bundle .
          echo "asset=$VERSION.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.tag }}
          IMAGE: ${{ steps.docker_version.outputs.image }}
        run: |
          # --latest=false: releases from different apps share this repo, so "latest" would be
          # meaningless. Consumers look up releases by tag.
          gh release create "$VERSION" "${{ steps.bundle.outputs.asset }}" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "Image: \`$IMAGE\`" \
            --latest=false
