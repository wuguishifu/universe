name: Deploy Web Apps

on:
  push:
    branches:
      - main
  # Deploys every web app regardless of what changed.
  workflow_dispatch:

permissions:
  contents: read
  # nx-set-shas reads past runs of this workflow to find the last successful deploy
  actions: read

concurrency:
  group: deploy-web-apps
  # Never cancel halfway through promoting; queue the next run instead.
  cancel-in-progress: false

env:
  # Not a secret: the "wuguishifu's projects" team, which owns every project in a vercel-config.json.
  VERCEL_ORG_ID: team_uU8Ny5zAvAjgdqkaRYEtMEoF
  VERCEL_CLI_VERSION: 67.0.0
  # Matches the Node.js version in the Vercel projects' settings, which the functions run on.
  NODE_VERSION: 26

jobs:
  plan:
    name: Find affected web apps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # nx affected needs the history between the base and head commits
          fetch-depth: 0

      - name: Install packages
        uses: ./.github/actions/setup-packages

      # Base is the commit of the last successful run of this workflow on main, so apps from a
      # failed run get redeployed on the next merge instead of being skipped.
      - name: Derive base and head SHAs
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: main

      - name: Find affected web apps
        id: apps
        uses: ./.github/actions/affected-web-apps
        with:
          base: ${{ env.NX_BASE }}
          head: ${{ env.NX_HEAD }}
          all: ${{ github.event_name == 'workflow_dispatch' }}

  # Builds every app here instead of on Vercel, then uploads it as a production deployment that is
  # not yet assigned to the app's domains. Nothing goes live until every app has built and
  # uploaded, so one app can't ship against a shared lib change that another app failed to build
  # with.
  build:
    name: Build ${{ matrix.app.project }}
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # The promote job is skipped as soon as any build fails, so don't waste time on the rest.
      fail-fast: true
      matrix:
        app: ${{ fromJson(needs.plan.outputs.apps) }}
    env:
      VERCEL_PROJECT_ID: ${{ matrix.app.vercelProjectId }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install packages
        uses: ./.github/actions/setup-packages
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"

      # Fetches the project's build settings and production env vars into .vercel/. That folder
      # holds secrets, so it never leaves this job; only the deployment URL does.
      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Runs the project's own install and build commands (e.g. `nx build sapphire-web`) and writes
      # the result to .vercel/output.
      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Upload deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          APP: ${{ matrix.app.project }}
          VERCEL_PROJECT: ${{ matrix.app.vercelProject }}
        run: |
          # --skip-domain: create the production deployment without pointing the domains at it yet.
          URL=$(vercel deploy --prebuilt --prod --skip-domain --archive=tgz --yes \
            --meta commit="$GITHUB_SHA" \
            --meta run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --token="$VERCEL_TOKEN")

          if [[ "$URL" != https://* ]]; then
            echo "::error::vercel deploy did not print a deployment URL: $URL"
            exit 1
          fi
          echo "Staged $VERCEL_PROJECT at $URL"

          mkdir -p out
          jq -n --arg app "$APP" --arg vercelProject "$VERCEL_PROJECT" --arg url "$URL" \
            '{app: $app, vercelProject: $vercelProject, url: $url}' \
            > out/deployment.json

      - name: Save deployment URL
        uses: actions/upload-artifact@v4
        with:
          name: web-app-${{ matrix.app.project }}
          path: out/deployment.json
          retention-days: 1
          if-no-files-found: error

  promote:
    name: Promote ${{ matrix.app.project }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Once promoting has started, finish every app rather than leave the rest half-released.
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.apps) }}
    env:
      VERCEL_PROJECT_ID: ${{ matrix.app.vercelProjectId }}
    steps:
      - name: Download deployment URL
        uses: actions/download-artifact@v4
        with:
          name: web-app-${{ matrix.app.project }}
          path: out

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"

      - name: Promote to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(jq -r '.url' out/deployment.json)
          echo "Promoting $(jq -r '.vercelProject' out/deployment.json): $URL"
          vercel promote "$URL" --yes --token="$VERCEL_TOKEN"
