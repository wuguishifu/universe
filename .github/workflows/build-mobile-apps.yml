name: Build Mobile Apps

on:
  push:
    branches:
      - main

permissions:
  contents: read
  # nx-set-shas reads past runs of this workflow to find the last successful build
  actions: read

concurrency:
  group: build-mobile-apps
  # Never cancel an EAS run halfway through starting; queue the next run instead.
  cancel-in-progress: false

jobs:
  plan:
    name: Find affected mobile apps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # nx affected needs the history between the base and head commits
          fetch-depth: 0

      - name: Install packages
        uses: ./.github/actions/setup-packages

      # Base is the commit of the last successful run of this workflow on main, so apps whose EAS
      # run failed to start get rebuilt on the next merge instead of being skipped.
      - name: Derive base and head SHAs
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: main

      - name: Find affected mobile apps
        id: apps
        uses: ./.github/actions/affected-mobile-apps
        with:
          base: ${{ env.NX_BASE }}
          head: ${{ env.NX_HEAD }}

  # Each app's release runs as its EAS workflow (<root>/.eas/workflows/build.yml) on EAS's machines,
  # which decides between a native build and an OTA update. This job only uploads the checkout and
  # starts it, since the free tier's queue can take over an hour. A failed EAS run sends its own
  # notification, but this run still succeeds, so the next merge won't release that app again unless
  # it's affected again.
  build:
    name: Build ${{ matrix.app.project }}
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Apps ship independently, so one failing shouldn't stop the others.
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.apps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # eas-cli reads the app config, which needs the app's expo package installed.
      - name: Install packages
        uses: ./.github/actions/setup-packages

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Run EAS workflow
        working-directory: ${{ matrix.app.root }}
        run: eas workflow:run .eas/workflows/build.yml --non-interactive
