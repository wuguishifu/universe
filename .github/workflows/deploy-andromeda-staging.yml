name: Deploy Andromeda Staging

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.before || 'origin/staging' }}
      HEAD: ${{ github.sha }}
      TOKEN: ${{ secrets.PERSONAL_REPO_TOKEN }}
      GPG_PASSPHRASE: ${{ secrets.GPG_KEY }}
      ENVIRONMENT: 'staging'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Prepare clean repo
        run: |
          rm -rf .git
          rm -rf .github
          git init -b main
          git config user.name "admin"
          git config user.email "admin@panyon.co"
          git add .
          git commit -m 'Deploy "$HEAD"'

      - name: Mirror to personal repo
        run: |
          git remote add origin https://x-access-token:${TOKEN}@github.com/panyonco/andromeda-staging.git
          git push --force origin main
