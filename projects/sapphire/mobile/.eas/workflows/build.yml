# Run by .github/workflows/build-mobile-apps.yml when a merge to main affects this app, or by hand
# with `eas workflow:run .eas/workflows/build.yml`. There's no `on`, so EAS never starts it itself.
#
# Ships the merge as an OTA update when a build with the same native fingerprint already exists
# (fingerprint.config.js decides what counts as native), and makes a new build otherwise.
name: Build

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    hooks:
      # Only build jobs take pnpm from eas.json, and the image's default can't read the pnpm 12
      # lockfile, so install the root packageManager's version.
      before_install_node_modules:
        - run: npm install -g "$(node -p "require('../../../package.json').packageManager.split('+')[0]")"

  get_ios_build:
    name: Find iOS build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      # Dev client builds can share the fingerprint, so only match the build updates go out to.
      profile: production-internal
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  build_ios:
    name: Build iOS
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production-internal

  update_ios:
    name: Publish iOS update
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    params:
      platform: ios
      # Matches the build profile's channel in eas.json
      channel: production-internal
    hooks:
      # Same pnpm install as the fingerprint job.
      before_install_node_modules:
        - run: npm install -g "$(node -p "require('../../../package.json').packageManager.split('+')[0]")"
      # Builds get this from eas-build-post-install, but that's an EAS Build hook, so the update's
      # bundle needs it done here.
      after_install_node_modules:
        - run: cd ../../../ && NX_DAEMON=false pnpm nx build convex-contracts
