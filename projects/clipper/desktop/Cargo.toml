[workspace]
resolver = "3"
members = ["src-tauri", "crates/capture"]

[workspace.package]
edition = "2024"
version = "0.0.1"
publish = false

[workspace.dependencies]
clipper-capture = { path = "crates/capture" }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
