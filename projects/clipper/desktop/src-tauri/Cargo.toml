[package]
name = "clipper-desktop"
description = "Clipper for Windows"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
# The _lib suffix keeps the lib's name apart from the binary's (cargo#8519).
name = "clipper_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clipper-capture.workspace = true
serde.workspace = true
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tracing.workspace = true
tracing-subscriber.workspace = true
windows = { version = "0.62", features = ["Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging"] }
