services:
  iridium:
    image: ghcr.io/wuguishifu/universe/iridium:latest
    container_name: iridium
    restart: unless-stopped
    # if you want to be able to access the scan API
    ports:
      - "3000:3000"
    environment:
      ENVIRONMENT: development
      DRY_RUN: true
      DEBUG_LOGGING: true
      MAX_HISTORY_RETENTION_MS: 5000
      RECONCILE_INTERVAL_MS: 30000
      RECONCILE_LEDGER_SYNC: true
      # strategy config
      TARGET_ENTRY: 0.97
      TARGET_POSITION_SIZE: 10
      MERGE_DEBOUNCE_MS: 10000
      # time filtering
      MIN_TIME_REMAINING_MS: 300000
      MAX_TIME_REMAINING_MS: 3300000
      # skew config
      ENABLE_SKEW_CHECK: true
      MIN_SKEW_PRICE_CUTOFF: 0.15
      MIN_TOTAL_COST: 0.8
      MAX_TOTAL_COST: 1.01
      # price stability config
      ENABLE_PRICE_STABILITY_CHECK: true
      PRICE_STABILITY_RANGE_CENTS: 3
      PRICE_STABILITY_DURATION_MS: 2000
      # trend filter config
      ENABLE_TREND_FILTER: true
      TREND_WINDOW_MS: 30000
      MAX_TREND_RATIO: 0.6
      # momentum config
      ENABLE_MOMENTUM_DISCOUNTING: true
      VELOCITY_FACTOR: 0.8
      ACCELERATION_FACTOR: 0.4
      MAX_DISCOUNT: 0.05
      # stop loss config
      PANIC_PRICE_DROP_THRESHOLD: 0.05
      PANIC_SUSTAINED_DROP_MS: 30000
      PANIC_ABSOLUTE_TIMEOUT_MS: 300000
      # clob config 
      PRIVATE_KEY: ${PRIVATE_KEY}
      SIGNATURE_TYPE: 1
      FUNDER_ADDRESS: ${FUNDER_ADDRESS}
      # relayer config 
      POLY_API_KEY: ${POLY_API_KEY}
      POLY_API_SECRET: ${POLY_API_SECRET}
      POLY_API_PASSPHRASE: ${POLY_API_PASSPHRASE}
