services:
  platinum:
    image: ghcr.io/wuguishifu/universe/platinum:latest
    container_name: platinum
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      OSMIUM_API_ACCESS_KEY: ${OSMIUM_API_ACCESS_KEY}
      ENABLE_VERBOSE_EVENTS: false
      DRY_RUN: true

      USER_ADDRESS: ${USER_ADDRESS}
      LIQUIDATION_INTERVAL_MS: 10000

      PRIVATE_KEY: ${PRIVATE_KEY}
      SIGNATURE_TYPE: 1
      FUNDER_ADDRESS: ${FUNDER_ADDRESS}

      POLY_API_KEY: ${POLY_API_KEY}
      POLY_API_SECRET: ${POLY_API_SECRET}
      POLY_API_PASSPHRASE: ${POLY_API_PASSPHRASE}
