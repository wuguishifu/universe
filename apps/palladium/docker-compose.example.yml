services:
  palladium:
    image: ghcr.io/wuguishifu/universe/palladium:latest
    container_name: palladium
    restart: unless-stopped
    # if you want to be able to access the scan API
    ports:
      - "3000:3000"
    environment:
      ENVIRONMENT: development
      OSMIUM_API_ACCESS_KEY: ${OSMIUM_API_ACCESS_KEY}
      DRY_RUN: true
      DEBUG_LOGGING: true
      ENABLE_VERBOSE_EVENTS: true
      DEBUG_CLEAR_STRATEGIES: false

      # clob config 
      PRIVATE_KEY: ${PRIVATE_KEY}
      SIGNATURE_TYPE: 1
      FUNDER_ADDRESS: ${FUNDER_ADDRESS}

      # relayer config 
      POLY_API_KEY: ${POLY_API_KEY}
      POLY_API_SECRET: ${POLY_API_SECRET}
      POLY_API_PASSPHRASE: ${POLY_API_PASSPHRASE}
